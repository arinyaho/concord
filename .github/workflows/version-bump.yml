name: version-bump

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plugin version tests against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          CONCORD_BASE_VERSION="$(git show "origin/$BASE_REF:VERSION")" node --test plugins/concord/hooks/test/version-bump.test.js plugins/concord/hooks/test/plugin-version.test.js
