name: pr-review
on:
  workflow_dispatch:
    inputs:
      repo:   { description: 'owner/name of the repository', required: true }
      pr:     { description: 'pull request number', required: true }
      sha:    { description: 'head commit to review', required: true }
      mode:   { description: 'broad or diff', required: true }
      cmd_id: { description: 'id of the comment that asked, if any', required: false }

# One review per pull request. A newer commit dispatches its own run, which
# cancels this one -- reviewing a commit the branch has already left is waste.
concurrency:
  group: pr-review-${{ inputs.repo }}-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: vars.REVIEW_REPOS != ''
    runs-on: ${{ fromJSON(vars.REVIEW_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: services/pr-review/review-one.sh
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          CMD_ID: ${{ inputs.cmd_id }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          GH_TOKEN: ${{ secrets.REVIEW_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
