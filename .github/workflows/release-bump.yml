name: release-bump

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script counts the merges after the newest bump on origin/main, so a canceled, replaced or rerun run changes nothing it should not.
      # A push made with GITHUB_TOKEN starts no workflow run.
      - name: Raise the beta version on main
        run: node scripts/release-bump.mjs push main
