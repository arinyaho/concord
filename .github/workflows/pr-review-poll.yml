name: pr-review-poll
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be dispatched, spend nothing'
        type: boolean
        default: false

concurrency:
  group: pr-review-poll
  cancel-in-progress: false

jobs:
  scan:
    # Runs only where REVIEW_REPOS is configured, so a copy without it stays idle.
    if: vars.REVIEW_REPOS != ''
    runs-on: ${{ fromJSON(vars.REVIEW_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read   # naming any permission replaces the default set, so checkout needs this back
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: services/pr-review/scan.sh
        env:
          REPOS: ${{ vars.REVIEW_REPOS }}
          SELF: ${{ github.repository }}
          MAX_PER_RUN: ${{ vars.REVIEW_MAX_PER_RUN || '3' }}
          STALE_DAYS: ${{ vars.REVIEW_STALE_DAYS || '7' }}
          MANUAL_ONLY: ${{ vars.REVIEW_MANUAL_ONLY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          GH_TOKEN: ${{ secrets.REVIEW_PAT }}
          SELF_TOKEN: ${{ secrets.GITHUB_TOKEN }}
