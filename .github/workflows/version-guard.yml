name: version-guard

# pull_request_target runs the workflow and the script from the base branch; the pull request head is fetched as data and never checked out or executed.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A --depth fetch would make the full clone shallow and drop the merge base the three-dot diff needs.
      - name: Fail when the pull request edits version files
        env:
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags origin "refs/pull/$PR/head:refs/pr/head"
          node scripts/release-bump.mjs guard "origin/$BASE_REF" refs/pr/head
