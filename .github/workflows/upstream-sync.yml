name: upstream-sync
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    # Runs only in a private copy that names its upstream, never in the upstream itself.
    if: vars.UPSTREAM_REPO != ''
    runs-on: ${{ fromJSON(vars.REVIEW_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows, so the
      # push needs a token with Contents and Workflows write on this copy.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      # Follows the newest release, the last upstream commit that changed
      # VERSION, so unreleased work never runs with this copy's secrets. A
      # fast-forward only: a copy carrying its own commits fails here loudly
      # instead of merging.
      - run: |
          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" main
          release=$(git log -1 --format=%H FETCH_HEAD -- VERSION)
          if git merge-base --is-ancestor "$release" HEAD; then echo "already at or past $release"; exit 0; fi
          git merge --ff-only "$release"
          git push origin HEAD:main
        env:
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
