name: pull-request

on:
  pull_request:
    paths:
      - "plugins/**"
      - "services/agent-team/**"
      - "scripts/release-version.mjs"
      - "scripts/release-bump.mjs"
      - "VERSION"
      - "README.md"
      - ".github/plugin/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/pull-request.yml"

permissions:
  contents: read

jobs:
  plugin-test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: find plugins -path '*/test/*.test.js' -type f -print0 | sort -z | xargs -0 -r node --test --test-shard=${{ matrix.shard }}/4

  # Keep the required check name stable while running the suite in parallel.
  plugin-tests:
    needs: plugin-test-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.plugin-test-shards.result }}

  agent-team-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-team
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/agent-team/package-lock.json

      - run: npm ci
      - run: npm test
