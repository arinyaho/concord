name: pr-review-lint

on:
  pull_request:
    paths:
      - "services/pr-review/**"
      - ".github/workflows/pr-review*.yml"
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # ubuntu-latest ships shellcheck.
      - run: shellcheck services/pr-review/*.sh
